name: CD — Deploy to AWS EC2

# =============================================================================
# TRIGGER: runs AFTER the CI workflow completes successfully on main
# =============================================================================

on:
  workflow_run:
    workflows: ["CI — Build & Push to DockerHub"]
    types: [completed]
    branches: [main]

env:
  DOCKERHUB_USERNAME: maitry2212
  IMAGE_NAME: maitry2212/one-click-ml-pipeline

jobs:
  # ============================================================================
  # JOB — DEPLOY: SSH into EC2 and pull + restart containers
  # ============================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # Only deploy if the CI workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Get the SHA of the triggering commit ─────────────────────────────
      - name: Get image tag from triggering workflow
        id: image_tag
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHA::7}"
          echo "tag=sha-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "📦 Image tag: sha-${SHORT_SHA}"

      # ── Deploy via SSH ────────────────────────────────────────────────────
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          # Timeout for ML training servers (they can be slow to start)
          command_timeout: 5m
          script: |
            set -e  # Exit immediately on any error

            echo "🚀 Starting deployment — $(date)"

            # ── Navigate to project directory ──────────────────────────────
            cd /home/${{ secrets.EC2_USER }}/ml-pipeline

            # ── Pull latest image from DockerHub ──────────────────────────
            echo "📥 Pulling latest Docker image..."
            docker pull ${{ env.IMAGE_NAME }}:latest
            docker pull ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}

            # ── Export environment variable for compose ────────────────────
            export IMAGE_TAG=${{ steps.image_tag.outputs.tag }}

            # ── Zero-downtime rolling restart ──────────────────────────────
            # Start new backend container before stopping old one
            echo "♻️  Restarting backend service..."
            docker compose --env-file .env.production pull backend
            docker compose --env-file .env.production up -d --no-deps --force-recreate backend

            # Wait for backend health check to pass
            echo "⏳ Waiting for backend to become healthy..."
            for i in $(seq 1 12); do
              if docker compose --env-file .env.production exec -T backend \
                curl -sf http://localhost:8000/ > /dev/null 2>&1; then
                echo "✅ Backend is healthy!"
                break
              fi
              echo "  Attempt $i/12 — backend not ready yet, waiting 5s..."
              sleep 5
              if [ "$i" -eq 12 ]; then
                echo "❌ Backend failed health check after 60s — rolling back!"
                docker compose --env-file .env.production up -d --no-deps --force-recreate backend
                exit 1
              fi
            done

            # ── Reload nginx (no downtime) ────────────────────────────────
            echo "🔄 Reloading nginx..."
            docker compose --env-file .env.production exec -T nginx nginx -s reload

            # ── Clean up unused images (save disk space) ──────────────────
            echo "🧹 Cleaning up dangling images..."
            docker image prune -f

            echo "✅ Deployment complete — $(date)"
            echo "📦 Running image: ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}"

      # ── Notify on Success ─────────────────────────────────────────────────
      - name: Deployment succeeded
        if: success()
        run: |
          echo "🎉 Deployment to EC2 succeeded!"
          echo "Image: ${{ env.IMAGE_NAME }}:${{ steps.image_tag.outputs.tag }}"

      # ── Notify on Failure ─────────────────────────────────────────────────
      - name: Deployment failed
        if: failure()
        run: |
          echo "💥 Deployment to EC2 FAILED!"
          echo "Check logs: https://github.com/${{ github.repository }}/actions"
          exit 1
