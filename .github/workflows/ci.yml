name: CI — Build & Push to DockerHub

# =============================================================================
# TRIGGER STRATEGY
# ─ push to main   → run tests + build + push image (tagged :latest + :SHA)
# ─ pull_request   → run tests only (no build/push for security)
# =============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKERHUB_USERNAME: maitry2212
  IMAGE_NAME: maitry2212/one-click-ml-pipeline

jobs:
  # ============================================================================
  # JOB 1 — VALIDATE: run import checks & module tests
  # ============================================================================
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4           # ← Updated from v3 to v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5       # ← Updated from v4 to v5
        with:
          python-version: "3.10"
          cache: "pip"                      # ← Cache pip to speed up installs

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate module imports
        run: |
          python -c "from src.config import settings; print('✅ Config OK')"
          python -c "from src.trainer import Trainer; print('✅ Trainer OK')"
          python -c "from src.predictor import Predictor; print('✅ Predictor OK')"
          python -c "from app.main import app; print('✅ FastAPI app OK')"

      - name: Check DVC pipeline DAG
        run: dvc dag || echo "⚠️  DVC DAG not runnable in CI (no data) — skipping"

  # ============================================================================
  # JOB 2 — BUILD & PUSH: only on push to main (not on PRs)
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Docker Buildx for multi-platform + advanced cache support ────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Login to DockerHub ───────────────────────────────────────────────
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ── Generate image tags (latest + immutable SHA tag) ─────────────────
      - name: Extract metadata for Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      # ── Build with layer cache from GitHub Actions cache ─────────────────
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache — dramatically speeds up subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build args for tracking
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_SHA=${{ github.sha }}

      - name: Print pushed image tags
        run: |
          echo "🐳 Pushed images:"
          echo "${{ steps.meta.outputs.tags }}"
