# =============================================================================
# NGINX Virtual Host — API Backend
# ONE-CLICK ML PIPELINE — PRODUCTION
# =============================================================================
# Replace YOUR_DOMAIN_HERE with your actual domain, e.g. api.yourdomain.com
# =============================================================================

# ── HTTP → HTTPS Redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    # Allow Certbot challenges for SSL renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_HERE;

    # ── SSL Certificates (Let's Encrypt via Certbot) ──────────────────────
    ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN_HERE/privkey.pem;

    # ── Modern SSL Config ─────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Security Headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── File Upload Limit (CSV files can be large) ────────────────────────
    client_max_body_size 100M;

    # ── API Proxy ─────────────────────────────────────────────────────────
    location /api/ {
        # Rate limiting — 30 req/min per IP
        limit_req zone=api_limit burst=10 nodelay;

        # Strip /api prefix and forward to backend
        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts (ML training can take a while)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ── Upload endpoint — stricter rate limit ─────────────────────────────
    location /api/upload {
        limit_req zone=upload_limit burst=5 nodelay;

        rewrite ^/api/(.*) /$1 break;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        client_max_body_size 100M;
    }

    # ── Health Check (public, no rate limit) ─────────────────────────────
    location /health {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        access_log off;
    }
}
