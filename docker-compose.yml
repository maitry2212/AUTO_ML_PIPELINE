version: '3.8'

# =============================================================================
# ONE-CLICK ML PIPELINE — PRODUCTION docker-compose.yml
# =============================================================================
# Services:
#   backend  — FastAPI application (uvicorn)
#   nginx    — Reverse proxy + static file server
#
# Usage:
#   docker compose --env-file .env.production up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # BACKEND — FastAPI + Uvicorn
  # ---------------------------------------------------------------------------
  backend:
    image: maitry2212/one-click-ml-pipeline:${IMAGE_TAG:-latest}
    container_name: ml_backend
    restart: unless-stopped

    environment:
      # ── Application ──────────────────────────────────────────────────────
      - PORT=8000
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # ── MLflow ───────────────────────────────────────────────────────────
      # Using sqlite stored on a named volume so data persists across restarts
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow_data/mlflow.db
      - MLFLOW_ARTIFACT_ROOT=/app/mlflow_data/mlartifacts
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-One_Click_ML_Experiment}
      # ── CORS ─────────────────────────────────────────────────────────────
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://your-domain.com}

    volumes:
      # Persistent storage for ML projects (user data)
      - ml_storage:/app/storage
      # Persistent MLflow database + model artifacts
      - mlflow_data:/app/mlflow_data
      # Persistent model files
      - ml_models:/app/models

    expose:
      # Only expose to internal Docker network — nginx is the public gateway
      - "8000"

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # NGINX — Reverse Proxy + Static File Server
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: ml_nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Nginx config (mounted from host — no rebuild needed to change config)
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL certificates (managed by Certbot on the host)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      # Nginx logs
      - nginx_logs:/var/log/nginx

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app_network

    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# NAMED VOLUMES — data persists even when containers are removed
# =============================================================================
volumes:
  ml_storage:
    driver: local
  mlflow_data:
    driver: local
  ml_models:
    driver: local
  nginx_logs:
    driver: local

# =============================================================================
# NETWORKS — isolated internal network; only nginx exposed publicly
# =============================================================================
networks:
  app_network:
    driver: bridge
